<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Book | Weekly Planner</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="planner">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="wrap">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Dashboard</a>
        <a href="recipes.html">Recipes</a>
        <a href="planner.html" aria-current="page">Weekly Planner</a>
        <button type="button" data-open-ask-dialog>Ask for a recipe</button>
      </nav>
    </header>

    <header class="page-header">
      <span class="eyebrow">Weekly Kitchen Planner</span>
      <h1>Plan the week,<br><em>without the chaos</em></h1>
    </header>

    <main id="content" class="planner-shell">
      <aside class="planner-browser">
        <div class="content-head">
          <h2>Recipe browse</h2>
        </div>
        <input id="plannerSearch" class="search-box" type="search" placeholder="Search recipes to add" />
        <div id="selectedRecipeSummary" class="selected-recipe-summary">No recipe selected</div>
        <div id="plannerList" class="browser-list"></div>
      </aside>

      <section class="planner-board">
        <div class="content-head">
          <h2>Week plan</h2>
          <div class="actions-row">
            <button type="button" class="secondary-button" id="resetWeek">Reset week</button>
          </div>
        </div>
        <div id="plannerGrid" class="planner-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Recipe Book — a family kitchen companion.</p>
    </footer>
  </div>

  <nav class="bottom-tab-bar" aria-label="Main navigation">
    <a href="index.html">Dashboard</a>
    <a href="recipes.html">Recipes</a>
    <a href="planner.html" aria-current="page">Planner</a>
  </nav>

  <div id="snackbar" class="snackbar" aria-live="polite"></div>
  <div id="turnstileContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
