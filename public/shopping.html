<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Book | Shopping List</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a3d2f" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="js/theme.js"></script>
  <!-- modulepreload: generated by scripts/build-preloads.mjs — do not edit by hand -->
  <link rel="modulepreload" href="js/components/account.js" />
  <link rel="modulepreload" href="js/components/ask-dialog.js" />
  <link rel="modulepreload" href="js/components/dialog.js" />
  <link rel="modulepreload" href="js/components/theme-toggle.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/lib/auth.js" />
  <link rel="modulepreload" href="js/lib/dom.js" />
  <link rel="modulepreload" href="js/lib/household.js" />
  <link rel="modulepreload" href="js/lib/pending-invite.js" />
  <link rel="modulepreload" href="js/lib/planner-remote.js" />
  <link rel="modulepreload" href="js/lib/planner-store.js" />
  <link rel="modulepreload" href="js/lib/queries.js" />
  <link rel="modulepreload" href="js/lib/shopping-store.js" />
  <link rel="modulepreload" href="js/lib/supabase-client.js" />
  <link rel="modulepreload" href="js/pages/shopping.js" />
  <link rel="modulepreload" href="js/shared/account-copy.js" />
  <link rel="modulepreload" href="js/shared/html.js" />
  <link rel="modulepreload" href="js/shared/plan-summary.js" />
  <link rel="modulepreload" href="js/shared/planner-constants.js" />
  <link rel="modulepreload" href="js/shared/shopping-list.js" />
  <link rel="modulepreload" href="js/shared/units.js" />
  <!-- /modulepreload -->
</head>
<body data-page="shopping">
  <a class="skip-link" href="#content">Skip to content</a>

  <nav class="app-nav" aria-label="Main navigation">
    <span class="app-nav-wordmark">Recipe Book</span>
    <ul class="app-nav-links">
      <li><a href="index.html"><span class="app-nav-icon" aria-hidden="true">🏠</span><span class="app-nav-label">Dashboard</span></a></li>
      <li><a href="recipes.html"><span class="app-nav-icon" aria-hidden="true">🍲</span><span class="app-nav-label">Recipes</span></a></li>
      <li><a href="planner.html"><span class="app-nav-icon" aria-hidden="true">🗓️</span><span class="app-nav-label">Planner</span></a></li>
      <li><a href="shopping.html" aria-current="page"><span class="app-nav-icon" aria-hidden="true">🛒</span><span class="app-nav-label">Shopping</span></a></li>
      <li><button type="button" class="app-nav-ask" data-open-ask-dialog><span class="app-nav-icon" aria-hidden="true">✨</span><span class="app-nav-label">Ask</span></button></li>
    </ul>
    <div class="app-nav-footer">
      <button type="button" class="primary-button app-nav-add" data-open-add-recipe>Add a recipe</button>
    </div>
  </nav>

  <div class="wrap">


    <main id="content">
      <header class="page-header">
        <h1>Shopping list</h1>
        <p class="page-header-note" id="shoppingAccountNote" hidden></p>
        <div class="header-actions">
          <div class="account-slot" id="accountSlot"></div>
          <button type="button" class="icon-button theme-toggle-button" id="themeToggleButton"></button>
        </div>
      </header>

      <section class="panel shopping-controls">
        <div class="week-nav">
          <button type="button" class="icon-button" id="prevWeek" aria-label="Previous week">‹</button>
          <span id="weekLabel" class="week-label">This week</span>
          <button type="button" class="icon-button" id="nextWeek" aria-label="Next week">›</button>
          <button type="button" class="ghost-button" id="thisWeek">This week</button>
        </div>
        <div class="actions-row shopping-actions" id="shoppingActions" hidden>
          <button type="button" class="ghost-button" id="copyList">Copy</button>
          <button type="button" class="ghost-button" id="shareList" hidden>Share</button>
          <button type="button" class="ghost-button" id="printList">Print</button>
          <button type="button" class="ghost-button" id="clearTicks">Clear ticks</button>
        </div>
      </section>

      <div class="status-region" id="shoppingStatus" aria-live="polite"></div>
      <p class="notice" id="shoppingSummary"></p>

      <form class="panel add-item-form" id="addItemForm">
        <label class="sr-only" for="addItemInput">Add an item</label>
        <input type="text" id="addItemInput" class="search-box" maxlength="80" placeholder="Add an item — kitchen roll…" autocomplete="off" />
        <button type="submit" class="primary-button">Add</button>
      </form>

      <div id="shoppingList"></div>
    </main>

    <footer class="site-footer">
      <p>Made with love, for one family's kitchen.</p>
    </footer>
  </div>

  <div id="snackbar" class="snackbar" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
