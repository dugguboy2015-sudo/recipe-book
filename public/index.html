<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Book</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a3d2f" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="js/theme.js"></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#content">Skip to content</a>

  <nav class="app-nav" aria-label="Main navigation">
    <span class="app-nav-wordmark">Recipe Book</span>
    <ul class="app-nav-links">
      <li><a href="index.html" aria-current="page"><span class="app-nav-icon" aria-hidden="true">🏠</span><span class="app-nav-label">Dashboard</span></a></li>
      <li><a href="recipes.html"><span class="app-nav-icon" aria-hidden="true">🍲</span><span class="app-nav-label">Recipes</span></a></li>
      <li><a href="planner.html"><span class="app-nav-icon" aria-hidden="true">🗓️</span><span class="app-nav-label">Planner</span></a></li>
      <li><a href="shopping.html"><span class="app-nav-icon" aria-hidden="true">🛒</span><span class="app-nav-label">Shopping</span></a></li>
      <li><button type="button" class="app-nav-ask" data-open-ask-dialog><span class="app-nav-icon" aria-hidden="true">✨</span><span class="app-nav-label">Ask</span></button></li>
    </ul>
    <div class="app-nav-footer">
      <button type="button" class="primary-button app-nav-add" data-open-add-recipe>Add a recipe</button>
    </div>
  </nav>

  <div class="wrap">


    <main id="content" class="page-shell">
      <header class="page-header">
        <h1 id="dashboardGreeting">This week</h1>
        <p class="page-header-note" id="dashboardAccountNote" hidden></p>
        <div class="header-actions">
          <div class="account-slot" id="accountSlot"></div>
          <button type="button" class="icon-button theme-toggle-button" id="themeToggleButton"></button>
        </div>
      </header>

      <div class="dashboard-grid">
        <section class="planner-card this-week-card" id="thisWeekCard">
          <div class="content-head">
            <h2>This week</h2>
          </div>
          <div id="thisWeekBody"></div>
        </section>

        <section class="planner-card ask-inline-card">
          <div class="content-head">
            <h2><span aria-hidden="true">✨</span> Ask for a recipe</h2>
          </div>
          <p class="ask-inline-lede">Describe what you're after and AI will draft a full recipe from the collection's style.</p>
          <div class="chip-group ask-suggestion-chips" id="askSuggestionChips">
            <button type="button" class="chip" data-ask-suggestion="a quick protein-rich breakfast">Quick breakfast</button>
            <button type="button" class="chip" data-ask-suggestion="a high-protein dinner for tonight">High-protein dinner</button>
            <button type="button" class="chip" data-ask-suggestion="a nut-free packed lunch the kids will eat">Kids will eat</button>
          </div>
          <form id="dashAskForm" class="ask-inline-form">
            <label class="sr-only" for="dashAskInput">Describe the recipe you want</label>
            <input type="text" id="dashAskInput" class="search-box" placeholder="e.g. a quick protein-rich breakfast" autocomplete="off" />
            <button type="submit" class="primary-button">Ask</button>
          </form>
          <div id="askRecipeTip"></div>
        </section>

        <section class="dashboard-recent">
          <div class="content-head">
            <h2>Recently added</h2>
          </div>
          <div class="card-grid recent-grid" id="recentGrid"></div>
        </section>

        <section class="card-grid stats-grid dashboard-stats" id="statsGrid"></section>
      </div>
    </main>

    <footer class="site-footer">
      <p>Recipe Book — a family kitchen companion.</p>
    </footer>
  </div>

  <div id="snackbar" class="snackbar" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
